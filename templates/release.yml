name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/upload.jks

      - name: Build AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Flavor is optional — only pass --flavor if the FLAVOR repo var is set.
          FLAVOR_ARG=""
          [ -n "${{ vars.FLAVOR }}" ] && FLAVOR_ARG="--flavor ${{ vars.FLAVOR }}"
          # Add any --dart-define flags your app needs, e.g.:
          # --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
          flutter build appbundle \
            --release \
            $FLAVOR_ARG \
            --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/**/*.aab

      - name: Upload to Play (internal)
        if: env.HAS_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.APP_PACKAGE }}
          releaseFiles: build/app/outputs/bundle/**/*.aab
          track: internal

  github-release:
    runs-on: ubuntu-latest
    needs: android
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.aab
